name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project files
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          find . -maxdepth 2 -type f | sort | head -200

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml was not found in the repository root."
            exit 1
          fi

      - name: Create Android platform files if missing
        run: |
          if [ ! -d "android" ]; then
            echo "android folder does not exist."
            echo "Creating Android platform files..."
            flutter create . --platforms=android --org=com.hse.inspection
          else
            echo "android folder already exists."
          fi

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Inspection-App-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
